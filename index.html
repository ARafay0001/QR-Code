    <script>
      window.addEventListener(
        "load",
        () => {
          let started = false;
          let timer;
          const events = ["pointerdown", "keydown", "touchstart"];
          const initializeAnalytics = () => {
            if (started) return;
            started = true;
            window.clearTimeout(timer);
            events.forEach((event) =>
              window.removeEventListener(event, initializeAnalytics),
            );

            window.dataLayer = window.dataLayer || [];
            window.gtag = function () {
              window.dataLayer.push(arguments);
            };
            window.gtag("js", new Date());
            window.gtag("config", "G-8FP08QDLG6");

            const script = document.createElement("script");
            script.async = true;
            script.src =
              "https://www.googletagmanager.com/gtag/js?id=G-8FP08QDLG6";
            document.head.appendChild(script);
          };

          events.forEach((event) =>
            window.addEventListener(event, initializeAnalytics, {
              once: true,
              passive: true,
            }),
          );
          timer = window.setTimeout(initializeAnalytics, 10000);
        },
        { once: true },
      );
    </script>
